<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/global.css"/>
    <link rel="stylesheet" href="/Spiele/SpinWheel/spinwheel.css"/>
    <link rel="stylesheet" href="/CSS/coins.css"/>
    <title>Spinwheel</title>
  </head>
  
  <body>
    <nav>
      <div class="nav__header">
        <div class="nav__logo">
          <a href="/HTML/home.html"><span>SlotMaster</span>24</a>
        </div>
        <div class="nav__menu__btn" id="menu-btn">
          <span><i class="ri-menu-line"></i></span>
      </div>
      </div>
      <ul class="nav__links" id="nav-links">
        <li><a href="/HTML/home.html">Home</a></li>
        <li><a href="/HTML/spiele.html">Spiele</a></li>
        <li><a href="/HTML/überuns.html">Über uns</a></li>
        <li><a href="/HTML/kontakt.html">Kontakt</a></li>
      </ul>
      <div class="nav__btns">
        <a href="/HTML/registrierung.html" class="btn sign__up">Registierung</a>
        <a href="/HTML/login.html" class="btn sign__in">Anmelden</a>
        <span id="nav-coins" class="coins-display" style="display:none;"></span>
        <button class="btn sign__out" id="nav-logout" style="display:none;">Abmelden</button>
      </div>
    </nav>

    <main>
        <h1> Spin & Win!</h1>
      <div class="container">
        <div class="modern-border">
          <canvas id="wheel"></canvas>
          <div class="pointer">&#9660;</div>
        </div>
        <button id="spinBtn">Drehen</button>
        <p id="result"></p>
        <div class="info">
          <p>Verbleibene Drehungen: <span id="spinsLeft">10</span></p>
          <p>Gewinn: <span id="score">0</span></p>
        </div>
      </div>
    </main>
 
    <script src="/JS/coins.js"></script>
    <script src="spinwheel.js"></script>
    <script src="/JS/navbar.js"></script>
    
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const navLinks = document.getElementById('nav-links');
        
        if (menuBtn && navLinks) {
            menuBtn.addEventListener('click', () => {
                // Fügt die 'open'-Klasse hinzu/entfernt sie, um das Menü ein-/auszublenden (gemäß deinem CSS)
                navLinks.classList.toggle('open');
            });
        }
    </script>
