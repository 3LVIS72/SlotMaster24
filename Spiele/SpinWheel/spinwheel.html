<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/global.css" />
    <link rel="stylesheet" href="/CSS/coins.css" />
    <link rel="stylesheet" href="/Spiele/SpinWheel/spinwheel.css" />
    <title>Spin & Win</title>
  </head>

  <body>
    <nav>
      <div class="nav__header">
        <div class="nav__logo">
          <a href="/HTML/home.html">SlotMaster<span>24</span></a>
        </div>
        <div class="nav__menu__btn" id="menu-btn">
          <span><i class="ri-menu-line"></i></span>
        </div>
      </div>
      <ul class="nav__links" id="nav-links">
        <li><a href="/HTML/home.html" id="nav-home">Home</a></li>
        <li><a href="/HTML/spiele.html">Spiele</a></li>
        <li><a href="/HTML/überuns.html">Über uns</a></li>
        <li><a href="/HTML/kontakt.html">Kontakt</a></li>
      </ul>
      <div class="nav__btns">
        <a href="/HTML/registrierung.html" class="btn sign__up" id="nav-register">Registrierung</a>
        <a href="/HTML/login.html" class="btn sign__in" id="nav-login">Anmelden</a>
        <span id="nav-coins" class="coins-display" style="display:none;"></span>
        <button class="btn sign__out" id="nav-logout" style="display:none;">Abmelden</button>
      </div>
    </nav>

    <main class="spinwheel">
      <div class="game-toolbar">
        <a class="back-link" href="/HTML/spiele.html"><i class="ri-arrow-left-line"></i> Zurück zu Spiele</a>
      </div>
      <section class="spinwheel__layout">
        <h1 class="spinwheel__title">Spin &amp; Win!</h1>
        <div class="spinwheel__card">
          <div class="modern-border">
            <canvas id="wheel"></canvas>
            <div class="pointer">▼</div>
          </div>
          <button id="spinBtn" class="spinwheel__button">Drehen</button>
          <p id="result" class="spinwheel__result" aria-live="polite"></p>
          <div class="spinwheel__info">
            <p>Einsatz pro Dreh: <span>5 Coins</span></p>
            <p>Session-Gewinn: <span id="score">0</span></p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 SlotMaster24 – Alle Rechte vorbehalten</p>
      <p>
        <a href="/HTML/impressum.html">Impressum</a> |
        <a href="/HTML/datenschutz.html">Datenschutz</a> |
        <a href="/HTML/kontakt.html">Kontakt</a>
      </p>
    </footer>

    <script src="/JS/auth.js"></script>
    <script src="/JS/coins.js"></script>
    <script src="spinwheel.js"></script>
    <script src="/JS/navbar.js"></script>
    <script>
      (function () {
        const menuBtn = document.getElementById('menu-btn');
        const navLinks = document.getElementById('nav-links');
        const menuIcon = menuBtn ? menuBtn.querySelector('i') : null;

        if (!menuBtn || !navLinks || !menuIcon) return;

        menuBtn.addEventListener('click', () => {
          navLinks.classList.toggle('open');
          const isOpen = navLinks.classList.contains('open');
          menuIcon.className = isOpen ? 'ri-close-line' : 'ri-menu-line';
          document.body.style.overflow = isOpen ? 'hidden' : '';
        });

        navLinks.addEventListener('click', (evt) => {
          if (evt.target.tagName === 'A') {
            navLinks.classList.remove('open');
            menuIcon.className = 'ri-menu-line';
            document.body.style.overflow = '';
          }
        });

        document.addEventListener('click', (evt) => {
          if (!navLinks.contains(evt.target) && !menuBtn.contains(evt.target)) {
            navLinks.classList.remove('open');
            menuIcon.className = 'ri-menu-line';
            document.body.style.overflow = '';
          }
        });
      })();
    </script>
  </body>
</html>
