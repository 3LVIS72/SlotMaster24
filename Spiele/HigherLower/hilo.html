<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hi-Lo – SlotMaster24</title>

    <!-- Globales Projekt-Stylesheet -->
    <link rel="stylesheet" href="/CSS/global.css" />
    <link rel="stylesheet" href="/CSS/coins.css" />

   
    <link rel="stylesheet" href="hilo.css" />

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
  </head>
  <body>
    <!-- NAVIGATION  -->
    <nav>
      <div class="nav__header">
        <div class="nav__logo">
          <a href="/HTML/home.html"><span>SlotMaster</span>24</a>
        </div>
        <div class="nav__menu__btn" id="menu-btn">☰</div>
      </div>

      <ul class="nav__links" id="nav-links">
        <li><a href="/HTML/home.html" id="nav-home">Home</a></li>
        <li><a href="/HTML/spiele.html">Spiele</a></li>
        <li><a href="/HTML/überuns.html">Über uns</a></li>
        <li><a href="/HTML/kontakt.html">Kontakt</a></li>
      </ul>

      <div class="nav__btns">
        <a href="/HTML/registrierung.html" class="btn sign__up" id="nav-register">Registrierung</a>
        <a href="/HTML/login.html" class="btn sign__in" id="nav-login">Anmelden</a>
        <span id="nav-coins" class="coins-display" style="display:none;"></span>
        <button class="btn sign__out" id="nav-logout" style="display:none;">Abmelden</button>
      </div>
    </nav>

    <main>
      <div class="game-toolbar">
        <a class="back-link" href="/HTML/spiele.html"><i class="ri-arrow-left-line"></i> Zurück zu Spiele</a>
      </div>
     
      <section class="hilo">
        <div class="container">
          <h1>Higher / Lower</h1>

          <div class="content">
            <div class="card" id="card">
              <span class="suit suit--tl" id="suitTL">♣</span>
              <span class="rank" id="rank">A</span>
              <span class="suit suit--br" id="suitBR">♣</span>
            </div>

            <div class="panel">
              <div class="balance">
                Kontostand: <b><span id="balance">10 000</span> Coins</b>
              </div>
              <div class="balance">
  


              <div class="bet-row">
                <label for="bet">Einsatz</label>
                <input type="number" id="bet" placeholder="z. B. 1.50" min="1" step="0.5" />
                <div class="chips">
                  <button class="chip" data-add="1">+1</button>
                  <button class="chip" data-add="5">+5</button>
                  <button class="chip" data-add="10">+10</button>
                </div>
              </div>

              <div class="actions">
                <button id="btnHigher"><i class="ri-arrow-up-line"></i> Höher</button>
                <button id="btnLower" class="alt"><i class="ri-arrow-down-line"></i> Niedriger</button>
              </div>

              <p id="status" class="status" aria-live="polite"></p>
              
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 SlotMaster24 – Alle Rechte vorbehalten</p>
      <p>
        <a href="/HTML/impressum.html">Impressum</a> |
        <a href="/HTML/datenschutz.html">Datenschutz</a> |
        <a href="/HTML/kontakt.html">Kontakt</a>
      </p>
    </footer>

    <script src="/JS/auth.js"></script>
    <script src="/JS/coins.js"></script>
    <script src="/JS/dashboard.js"></script>
    <script src="hilo.js"></script>
    <script src="/JS/navbar.js"></script>
  </body>
</html>
